name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf \
            libasound2-dev pkg-config xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # palace-app is excluded from the coverage gate below, so its real-window
      # behaviour is proven here instead: every display-gated test runs on the
      # real Tauri runtime under Xvfb. The display is given a real size because
      # `xvfb-run`'s 640x480 default is smaller than geometry_persistence's
      # fixtures, which would make that test skip instead of run. `GDK_BACKEND`
      # pins GTK to X11: without it GDK prefers Wayland whenever a `wayland-0`
      # socket is reachable, which on a developer machine means the test paints
      # on their real desktop instead of the virtual display. The WEBKIT_*
      # variables are the standard workaround for WebKitGTK on a GPU-less
      # runner; they change rendering, not behaviour. The Tests step above
      # already ran these binaries without a display, exercising their skip
      # paths.
      - name: Real-window tests (real webviews on a virtual display)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test -p palace-app --locked --no-fail-fast -- --nocapture --test-threads=1
        env:
          GDK_BACKEND: "x11"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"

  windows:
    name: tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No system packages to install here. The Windows runner images already
      # carry the MSVC toolchain and the WebView2 runtime, so unlike the Ubuntu
      # jobs this one has no apt-get step before the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # palace-app is excluded for the same reason the coverage job excludes
      # it: it is a GUI shell whose behaviour lives in the crates below it, and
      # building it needs the Tauri/webview toolchain a plain test run has not
      # set up. Everything else in the workspace is headless and testable here,
      # which is how Windows runtime behaviour gets its first real check.
      - name: Tests
        run: cargo test --workspace --exclude palace-app --locked

  coverage:
    name: coverage (>= 80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `palace-audio` pulls in cpal -> alsa-sys, whose build script runs
      # pkg-config for the ALSA headers. Without them the build aborts before a
      # single test runs, which is what turned this job red on 2026-09-18.
      - name: ALSA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # palace-app is excluded: it is a GUI shell whose behaviour lives in the
      # crates below it, and driving a window needs a display the runner has not.
      - name: Coverage
        run: cargo llvm-cov --workspace --exclude palace-app --fail-under-lines 80

  frontend:
    name: svelte-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
