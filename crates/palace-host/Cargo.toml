[package]
name = "palace-host"
description = "The live Palace host: IPTSCRAE event dispatch and a capability implementation over the client's session state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iptscrae = { workspace = true }
iptscrae-palace = { workspace = true }
palace-room = { workspace = true }
palace-wire = { workspace = true }

# Windows has no `/etc/localtime` and does not set `TZ`, so `GETTIMEZONE` asks
# the platform for the local offset. `chrono`'s `Local` wraps the OS time-zone
# API without `unsafe` (which this crate forbids) and is already in the
# workspace lock via the Tauri stack.
[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
palace-render = { workspace = true }
