[workspace]
resolver = "2"
members = [
    "crates/palace-wire",
    "crates/palace-room",
    "crates/palace-prop",
    "crates/palace-asset",
    "crates/palace-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# `ureq` 3.x (used by `palace-asset` for the media fetch) requires 1.85.
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/palace-client"

[workspace.dependencies]
palace-wire = { path = "crates/palace-wire" }
palace-room = { path = "crates/palace-room" }
palace-prop = { path = "crates/palace-prop" }
palace-asset = { path = "crates/palace-asset" }
serde_json = "1"
flate2 = "1.1"
png = "0.18"

[profile.release]
lto = "thin"
