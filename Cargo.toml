[workspace]
resolver = "2"
members = [
    "crates/palace-wire",
    "crates/palace-room",
    "crates/palace-prop",
    "crates/palace-probe",
    "crates/palace-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/palace-client"

[workspace.dependencies]
palace-wire = { path = "crates/palace-wire" }
palace-room = { path = "crates/palace-room" }
palace-prop = { path = "crates/palace-prop" }
palace-render = { path = "crates/palace-render" }
serde_json = "1"
flate2 = "1.1"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[profile.release]
lto = "thin"
